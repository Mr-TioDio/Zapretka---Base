<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Blood Chat</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="login-screen">
        <h2>Вход в Бездну</h2>
        <input type="text" id="username-input" placeholder="Твое имя...">
        <button id="login-button">Войти</button>
    </div>

    <div id="chat-container" style="display: none;">
        <div class="user-info">Вы: <span id="current-user-name"></span></div>
        <div id="messages"></div>
        <div class="input-area">
            <input id="input" autocomplete="off" placeholder="Пиши сюда...">
            <button id="send">Отправить</button>
        </div>
        <div class="friend-adder">
            <input id="friend-name" placeholder="Ник друга...">
            <button id="add-friend-btn">Добавить в друзья</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
